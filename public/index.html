<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progres Fit – Gestiune sală</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="login" hidden>
    <form id="form-login">
      <p class="marca">Progres Fit</p>
      <h1>Intră în cont</h1>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Parolă <input name="parola" type="password" autocomplete="current-password" required></label>
      <p class="eroare" role="alert"></p>
      <button>Intră în cont</button>
    </form>
  </main>

  <div id="app" hidden>
    <aside id="meniu">
      <p class="marca">Progres Fit</p>
      <nav id="nav" aria-label="Secțiuni"></nav>
      <div id="cont">
        <span id="cine"></span>
        <button id="logout" class="secundar">Ieși din cont</button>
      </div>
    </aside>
    <main id="continut"></main>
  </div>

  <dialog id="dialog">
    <form id="form-ent" method="dialog">
      <h2></h2>
      <div id="campuri"></div>
      <p class="eroare" role="alert"></p>
      <menu>
        <button type="button" class="secundar" id="renunta">Renunță</button>
        <button value="ok">Salvează</button>
      </menu>
    </form>
  </dialog>

  <div id="mesaj" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
